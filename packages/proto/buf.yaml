version: v2
modules:
  - path: .
    excludes:
      - node_modules
      - gen
lint:
  use:
    - STANDARD
  except:
    # Layout and names are mandated; RPCs reuse DTO types (including google.protobuf.Empty).
    - FILE_LOWER_SNAKE_CASE
    - PACKAGE_DIRECTORY_MATCH
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
